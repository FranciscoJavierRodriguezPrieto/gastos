<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover deja que el contenido llegue bajo la barra de estado del
       iPhone; los safe-area-inset del CSS se encargan de que nada quede tapado. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos</title>
  <meta name="description" content="Gestion financiera del hogar: gastos, cuentas e hipoteca.">

  <!-- La aplicacion tiene tema claro y oscuro; se declaran los dos para que iOS no
       aplique su propia inversion por encima. Cual se pinta lo decide `data-tema` en
       <html>, que escribe tema-inicial.js justo debajo. -->
  <meta name="color-scheme" content="light dark">
  <!-- Valor de partida: el del tema claro. src/ui/tema.js lo ajusta al arrancar y en
       cada cambio de tema, para que la barra del navegador vaya a juego. -->
  <meta name="theme-color" content="#b4c59d">

  <!-- Antes que las hojas de estilo y sin `defer` a proposito: si el tema se aplicara
       desde un modulo, quien tiene el modo oscuro puesto veria un fogonazo blanco en
       cada arranque. -->
  <script src="/tema-inicial.js"></script>

  <!-- Safari ignora buena parte del manifiesto, asi que la instalacion en iOS necesita
       ademas estas etiquetas. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">

  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/app.css">
  <link rel="stylesheet" href="/src/styles/hipoteca.css">
</head>
<body data-estado="cargando">
  <!-- Enlace de salto: primer tabulador de la pagina, para no obligar a recorrer toda la
       navegacion con el teclado. -->
  <a class="salto" href="#contenido">Ir al contenido</a>

  <div id="app" class="app">
    <p class="estado estado--cargando">Cargando...</p>
  </div>

  <noscript>
    <p class="estado estado--error">
      Esta aplicacion necesita JavaScript para funcionar.
    </p>
  </noscript>

  <!-- Antes que el modulo a proposito: los modulos van diferidos, asi que cuando
       app.js se evalua la configuracion ya esta puesta. -->
  <script src="/config.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
