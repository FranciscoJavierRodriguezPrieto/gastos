spring:
  application:
    name: gastos
  main:
    banner-mode: off

  datasource:
    # Sin valores por defecto embebidos: la conexion se inyecta por entorno y las
    # credenciales nunca viven en el repositorio.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gastos}
    username: ${SPRING_DATASOURCE_USERNAME:gastos}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Una instancia gratuita no aguanta un pool grande, y con dos usuarios no hace falta.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    # El esquema lo gobierna Flyway; Hibernate solo comprueba que las entidades encajan.
    # Si alguna vez divergen, la aplicacion no arranca, que es exactamente lo que se
    # quiere: mejor un fallo al desplegar que una columna silenciosamente ignorada.
    hibernate:
      ddl-auto: validate
    # Cerrar la sesion al salir del servicio: sin esto, una entidad perezosa se cargaria
    # al serializar la respuesta y las consultas aparecerian fuera de toda transaccion.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Rele SMTP para el enlace de restablecimiento. Sin MAIL_HOST la aplicacion arranca
  # igual, pero no envia nada y lo avisa por log en cada intento.
  # Con Brevo: host smtp-relay.brevo.com, puerto 587, usuario el de tu cuenta y como
  # contrasena la clave SMTP (no la del panel).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fallar si alguien edita una migracion ya aplicada, en vez de callar.
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Un campo desconocido en el cuerpo es un error, no algo que ignorar en silencio:
      # avisa de contratos desincronizados y cierra el mass assignment (OWASP API6).
      fail-on-unknown-properties: true
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${PORT:8080}
  # No revelar el servidor de aplicaciones en las cabeceras (CCN-STIC-812: minimizar
  # la informacion que se ofrece a un atacante).
  server-header:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful
  # Limites de consumo de recursos (OWASP API4): ningun cuerpo de esta API se acerca
  # siquiera a estos tamanos.
  max-http-request-header-size: 8KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 256KB
    connection-timeout: 10s
    threads:
      max: 50

# Superficie de gestion reducida al minimo: solo health y sin detalle para anonimos.
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    # Sin SMTP configurado el indicador de correo dejaria la aplicacion en 503, y no es
    # cierto: la aplicacion sirve perfectamente sin poder enviar correos. Lo unico que
    # no funcionaria es el restablecimiento, y de eso ya avisa LoggingEmailSender.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.gastos: INFO

gastos:
  security:
    jwt:
      # Sin valor por defecto: si falta JWT_SECRET la aplicacion no arranca, y es
      # intencionado. Una clave por defecto en el codigo es una clave publica, y quien la
      # conozca puede fabricarse un token para cualquier hogar.
      secret: ${JWT_SECRET:}
      issuer: gastos
      # Corta porque un token de acceso no se puede revocar: si se filtra, el dano dura
      # lo que le quede de vida.
      access-token-ttl: 15m
      refresh-token-ttl: 30d

  # Origenes autorizados del frontend. Vacio significa que no se admite ninguno.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  password-reset:
    # Corta a proposito: el enlace viaja por un canal que no controlamos.
    ttl: 30m
    # A donde apunta el enlace del correo. Debe ser la URL publica del frontend.
    base-url: ${APP_BASE_URL:http://localhost:5173}
    # En Brevo tiene que ser un remitente verificado o el envio se rechaza.
    from: ${MAIL_FROM:gastos@localhost}

  rate-limit:
    enabled: true
    max-requests: 120
    window-seconds: 60

  mortgage:
    # Parametros de negocio externalizados: cambian por normativa, no por codigo.
    # Verificar contra la convocatoria vigente publicada por la Comunidad de Madrid.
    purchase-costs:
      transfer-tax-rate: 6.00
      ancillary-costs-rate: 4.00
    mi-primera-vivienda:
      max-loan-to-value: 95.00
      max-property-price: 390000
      max-applicant-age: 35
    lending:
      optimal-housing-dti: 25.00
      max-housing-dti: 30.00
      optimal-total-dti: 35.00
      max-total-dti: 40.00
      min-residual-income: 1000
