name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y verificar arquitectura
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify ejecuta los tests unitarios, los de integración y las reglas de ArchUnit.
      # Si una frontera del hexágono se rompe, el build falla aquí y no en revisión.
      - name: mvn verify
        run: mvn -B clean verify

      # El frontend no tiene dependencias: basta el ejecutor de tests de Node.
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests del frontend
        run: node --test "frontend/test/*.test.js"

      - name: Publicar informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7
