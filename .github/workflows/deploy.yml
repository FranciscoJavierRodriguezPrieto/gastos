name: Desplegar

# Sólo a mano, nunca automático.
#
# Es deliberado: a día de hoy `main` sigue en el commit inicial y nada se ha publicado
# todavía. Cuando haya un despliegue de verdad funcionando y se decida que `main` es
# producción, basta añadir aquí `push: branches: [main]`.
on:
  workflow_dispatch:
    inputs:
      que:
        description: Qué desplegar
        required: true
        default: ambos
        type: choice
        options: [api, frontend, ambos]
      url_api:
        description: URL pública de la API (necesaria para el frontend)
        required: true
        default: https://gastos-api.onrender.com

permissions:
  contents: read

jobs:
  api:
    name: API en Render
    if: inputs.que == 'api' || inputs.que == 'ambos'
    runs-on: ubuntu-latest

    steps:
      # Render construye la imagen desde infra/Dockerfile y despliega el repositorio, asi
      # que aqui no hay nada que construir ni que publicar: basta con dispararlo.
      #
      # `render.yaml` lleva autoDeploy: false para que el despliegue sea deliberado y no
      # cada push. El servicio se crea la primera vez desde el Blueprint, en el panel
      # (docs/DESPLIEGUE.md, paso 2.1); esto redespliega uno que ya existe.
      #
      # Los secretos de la aplicacion (JWT_SECRET, base de datos, correo) viven en Render
      # y no aqui, asi que no pasan por el registro de ejecuciones de GitHub.
      - name: Disparar el despliegue
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Falta el secreto RENDER_DEPLOY_HOOK_URL." >&2
            echo "Sale del panel de Render: servicio -> Settings -> Deploy Hook." >&2
            exit 1
          fi
          # --fail para que un 4xx o 5xx tumbe el job en vez de dar por bueno un
          # despliegue que nunca se ha disparado.
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

  frontend:
    name: PWA en Cloudflare Pages
    if: inputs.que == 'frontend' || inputs.que == 'ambos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ajusta a la vez config.js y el connect-src de la CSP. Si alguno de los dos
      # ficheros hubiera cambiado de forma, el script falla aquí en lugar de publicar
      # algo que no carga.
      - name: Preparar el frontend
        run: node scripts/preparar-frontend.mjs "${{ inputs.url_api }}"

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gastos
