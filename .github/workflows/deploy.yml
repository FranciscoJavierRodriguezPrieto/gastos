name: Desplegar

# Sólo a mano, nunca automático.
#
# Es deliberado: a día de hoy `main` sigue en el commit inicial y nada se ha publicado
# todavía. Cuando haya un despliegue de verdad funcionando y se decida que `main` es
# producción, basta añadir aquí `push: branches: [main]`.
on:
  workflow_dispatch:
    inputs:
      que:
        description: Qué desplegar
        required: true
        default: ambos
        type: choice
        options: [api, frontend, ambos]
      url_api:
        description: URL pública de la API (necesaria para el frontend)
        required: true
        default: https://gastos-api.koyeb.app

permissions:
  contents: read

jobs:
  api:
    name: API en Koyeb
    if: inputs.que == 'api' || inputs.que == 'ambos'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Para subir la imagen a GHCR. No hace falta ningún secreto: vale el GITHUB_TOKEN
      # que el propio workflow recibe.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Imprescindible para la cache de tipo gha: el driver de Docker que trae el runner
      # no sabe exportarla.
      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos etiquetas: `main`, que es la que el servicio de Koyeb tiene configurada y la
      # que se vuelve a descargar en cada redespliegue, y el SHA, para poder mirar luego
      # qué había desplegado exactamente.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gastos-api:main
            ghcr.io/${{ github.repository_owner }}/gastos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Preparar la CLI de Koyeb
        uses: koyeb-community/koyeb-actions@v2
        with:
          api_token: ${{ secrets.KOYEB_API_TOKEN }}

      # Redespliega un servicio que YA EXISTE; no lo crea. La primera vez hay que
      # crearlo a mano en el panel, apuntando a la etiqueta `main` de arriba y con sus
      # variables de entorno (docs/DESPLIEGUE.md, paso 2).
      #
      # Los secretos de la aplicación viven en Koyeb y no aquí a propósito: así no pasan
      # por el registro de ejecuciones de GitHub.
      - name: Redesplegar en Koyeb
        run: koyeb service redeploy gastos/api

  frontend:
    name: PWA en Cloudflare Pages
    if: inputs.que == 'frontend' || inputs.que == 'ambos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ajusta a la vez config.js y el connect-src de la CSP. Si alguno de los dos
      # ficheros hubiera cambiado de forma, el script falla aquí en lugar de publicar
      # algo que no carga.
      - name: Preparar el frontend
        run: node scripts/preparar-frontend.mjs "${{ inputs.url_api }}"

      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gastos
