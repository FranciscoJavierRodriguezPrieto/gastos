# Servidor de estáticos para desarrollo local.
#
# En producción esto lo hace Cloudflare Pages con el fichero `frontend/_headers`. Aquí se
# replican las mismas reglas de caché porque, sin ellas, nginx no manda `Cache-Control` y
# el navegador aplica su caché heurística: editas un fichero, recargas, y sigues viendo el
# anterior sin entender por qué. Pasa exactamente eso.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Imprescindible con montajes de Docker en Windows y macOS: con sendfile activado,
    # nginx sigue sirviendo los bytes anteriores de un fichero que acabas de editar. El
    # sintoma es desesperante, porque el fichero en disco ya esta bien y curl con otra
    # query lo devuelve actualizado. En produccion esto lo sirve Cloudflare Pages, asi
    # que no hay coste de rendimiento que lamentar.
    sendfile off;

    # El armazón se revalida siempre: es código, y una versión vieja pegada en caché es
    # un fallo muy caro de diagnosticar.
    location ~* ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    location /src/ {
        add_header Cache-Control "no-cache";
    }

    # Los iconos no cambian.
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Las rutas de la aplicación van en el fragmento (#/gastos), así que cualquier
    # petición de navegación cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mismas cabeceras de seguridad que en producción. La CSP apunta a la API local.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
