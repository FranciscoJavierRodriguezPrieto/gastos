# Cabeceras de seguridad, en fichero aparte para poder repetirlas en cada `location`.
#
# No es manía: en nginx, `add_header` **sólo se hereda del nivel anterior si el nivel
# actual no define ninguna**. Como cada `location` de nginx.conf añade su propio
# `Cache-Control`, todas perdían las cabeceras de seguridad del bloque `server`, incluida
# la CSP sobre `index.html` —justo el documento donde importa—. Repetirlas con un
# `include` es la forma de que eso no pueda volver a pasar sin que se note.
#
# En producción esto lo hace Cloudflare Pages con `frontend/_headers`, que sí mezcla las
# reglas que coinciden.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
